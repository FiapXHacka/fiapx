# Topology, users and permissions come from definitions.json (docs/architecture/04-mensageria.md).
# When definitions are imported at boot, the default guest user is not created.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# Processing a video can take minutes; per-queue x-consumer-timeout overrides this where needed.
consumer_timeout = 1800000
